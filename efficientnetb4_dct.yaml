# training/config/detector/efficientnetb4_dct.yaml
# B4 + DCT-residual attention. Mirrors efficientnetb4.yaml; only the marked lines differ.
# SMOKE vs FULL: change the 3 lines tagged [SMOKE]. Keep batch / lr / seed list IDENTICAL
# across every ablation config, or the comparison to baseline is not fair.

log_dir: logs/evaluations/effnb4_dct

# model setting
pretrained: ./training/pretrained/efficientnet-b4-6ed6700e.pth
model_name: efficientnetb4_dct      # MUST match @DETECTOR.register_module(module_name=...)
backbone_name: efficientnetb4

# DCT module params (read by EfficientDCTDetector)
dct_channels: 1792                  # final feature channels of B4 -- VERIFY (print feature shape)
dct_h: 7
dct_w: 7

# backbone setting
backbone_config:
  num_classes: 2
  inc: 3
  dropout: false
  mode: Original

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FaceForensics++]                 # full FF++ (4 manipulations + real)
test_dataset: [FaceForensics++, Celeb-DF-v2]     # within-domain + cross-domain

compression: c23
train_batchSize: 32          # [SMOKE] -> 16 ; keep SAME across all ablation configs
test_batchSize: 32
workers: 4
frame_num: {'train': 32, 'test': 32}   # [SMOKE] -> {'train': 4, 'test': 4}
resolution: 256
with_mask: false
with_landmark: false
save_ckpt: true              # keep true (duplicate 'false' line from the original removed)
save_feat: false

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# optimizer (batch 32 <-> lr 0.0002 ; if you change batch, re-scale lr)
optimizer:
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005

# training
lr_scheduler: null
nEpochs: 10                  # [SMOKE] -> 1
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024             # ablation seeds: 1024 / 2025 / 7
loss_func: cross_entropy
losstype: null

# metric
metric_scoring: auc

# cuda
cuda: true
cudnn: true
